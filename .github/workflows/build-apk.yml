name: Compiler APK Android Keo Note

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Keo Note APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Installation des dépendances
        run: npm install

      - name: Construction de l'application Web (Next.js export)
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

      - name: Initialisation du projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Génération des icônes Android depuis le logo SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Icônes classiques et rondes
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Icônes adaptatives Android 8+ (Foreground) - Remplace le logo bleu Capacitor !
          rsvg-convert -w 108 -h 108 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          rsvg-convert -w 162 -h 162 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          rsvg-convert -w 216 -h 216 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          rsvg-convert -w 324 -h 324 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          rsvg-convert -w 432 -h 432 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          # Couleur de fond adaptative assortie à la suite Keo (#090d16)
          if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
            sed -i 's/#FFFFFF/#090d16/gi' android/app/src/main/res/values/ic_launcher_background.xml
          fi

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Configuration des permissions Android (Microphone & Audio)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "Injection des permissions RECORD_AUDIO et MODIFY_AUDIO_SETTINGS dans $MANIFEST..."
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          fi
          echo "Permissions Android actives :"
          grep -i "uses-permission" "$MANIFEST" || true

      - name: Configuration de la version Android (versionCode & versionName)
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      - name: Compilation et Signature de l'APK Android
        working-directory: android
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "🚀 Compilation Release avec Gradle..."
          ./gradlew assembleRelease --stacktrace

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK généré : $UNSIGNED_APK"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
            echo "Alignement 4-byte de l'APK..."
            $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
            UNSIGNED_APK="aligned.apk"
          fi

          KEYSTORE_PATH="../keystore/keonote.keystore"
          if [ -n "$SIGNING_KEY" ]; then
            echo "🔑 Signature avec le secret de dépôt GitHub..."
            echo "$SIGNING_KEY" | base64 -d > release.keystore
            KEYSTORE_FILE="release.keystore"
            KEY_ALIAS="$ALIAS"
            STORE_PASS="$KEY_STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "🔑 Réutilisation du trousseau officiel permanent Keo Note..."
            KEYSTORE_FILE="$KEYSTORE_PATH"
            KEY_ALIAS="keonote"
            STORE_PASS="keonotepassword"
            KEY_PASS="keonotepassword"
          else
            echo "🔑 Génération initiale du trousseau officiel permanent Keo Note..."
            mkdir -p ../keystore
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias keonote -keyalg RSA -keysize 2048 -validity 10000 -storepass keonotepassword -keypass keonotepassword -dname "CN=KeoNote, OU=Apps, O=Otsmane, L=Paris, S=France, C=FR"
            KEYSTORE_FILE="$KEYSTORE_PATH"
            KEY_ALIAS="keonote"
            STORE_PASS="keonotepassword"
            KEY_PASS="keonotepassword"

            echo "📦 Enregistrement du trousseau permanent dans le dépôt GitHub..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "chore: persist Keo Note signing keystore [skip ci]" || true
            git push origin main || true
          fi

          echo "✍️ Signature cryptographique apksigner..."
          $APKSIGNER sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../KeoNote.apk \
            "$UNSIGNED_APK"

          echo "🛡️ Validation de l'APK signé :"
          $APKSIGNER verify --verbose ../KeoNote.apk
          rm -f release.keystore aligned.apk
          cp ../KeoNote.apk "../KeoNote-Build-${{ github.run_number }}.apk"

      - name: Publication de l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: keonote-android-apk
          path: |
            KeoNote.apk
            KeoNote-Build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Création / Mise à jour de la Release GitHub avec l'APK direct
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: Keo Note v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 📱 Keo Note v1.0.0 — Build ${{ github.run_number }}
            
            Bienvenue dans **Keo Note**, votre carnet de notes et mémos vocaux intelligent avec Second Cerveau IA.
            
            ### ✨ Nouveautés de ce Build :
            - 🎙️ **Prise de mémo vocal instantanée** avec retranscription en direct.
            - 🧠 **Structuration automatique par IA** : Titre, résumé, détection de to-dos à cocher et tags.
            - 🔍 **Second Cerveau** : Posez des questions à vos notes en langage naturel.
            - 🌓 Mode clair / sombre automatique et stockage 100% hors-ligne.
            
            ### 📥 Téléchargement direct :
            - **[KeoNote-Build-${{ github.run_number }}.apk](https://github.com/heyhacene/keonote/releases/download/v1.0.0-build.${{ github.run_number }}/KeoNote-Build-${{ github.run_number }}.apk)**
          draft: false
          prerelease: false
          files: |
            KeoNote.apk
            KeoNote-Build-${{ github.run_number }}.apk
