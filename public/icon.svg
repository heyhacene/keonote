<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dégradé principal du Carnet KeoNote : Violet Royal & Améthyste -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Dégradé de la reliure gauche -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Dégradé Or / Ambre lumineux pour l'IA & l'Onde Vocale -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Dégradé Blanc Pur pour le K et le Microphone -->
    <linearGradient id="kWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <!-- Ombre portée 3D du Carnet (identique à la profondeur de KeoPass) -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#7c3aed" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Ombre douce pour les éléments internes (K + Micro + Ondes) -->
    <filter id="innerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2e1065" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Arrière-plan Dark Squircle (Harmonie 100% avec KeoPass #090d16) -->
  <rect width="512" height="512" rx="120" fill="#090d16" />

  <!-- 2. Carnet Intelligent 3D (Zone de sécurité Android Adaptive Icon respectée) -->
  <g filter="url(#cardShadow)">
    <!-- Corps du carnet -->
    <rect x="92" y="76" width="328" height="360" rx="64" fill="url(#noteGrad)" />

    <!-- Reliure latérale gauche du carnet -->
    <path d="M 140 76 L 156 76 L 156 436 L 140 436 C 113 436 92 415 92 388 L 92 124 C 92 97 113 76 140 76 Z"
          fill="url(#spineGrad)" opacity="0.65" />

    <!-- Anneaux de reliure dorés/ambre sur la tranche gauche -->
    <rect x="76" y="138" width="34" height="14" rx="7" fill="url(#amberGrad)" />
    <rect x="76" y="212" width="34" height="14" rx="7" fill="url(#amberGrad)" />
    <rect x="76" y="286" width="34" height="14" rx="7" fill="url(#amberGrad)" />
    <rect x="76" y="360" width="34" height="14" rx="7" fill="url(#amberGrad)" />

    <!-- Facette droite (effet relief 3D comme sur KeoPass) -->
    <path d="M 264 76 L 356 76 C 391 76 420 105 420 140 L 420 372 C 420 407 391 436 356 436 L 264 436 Z"
          fill="#000000" opacity="0.10" />

    <!-- Bordure biseautée lumineuse interne -->
    <rect x="100" y="84" width="312" height="344" rx="56"
          fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25" />
  </g>

  <!-- 3. Lettre "K" combinée au Microphone & Onde Vocale IA -->
  <g filter="url(#innerShadow)">
    <!-- Pilier gauche du K = Microphone Vocal Stylisé -->
    <!-- Capsule du micro (haut du pilier) -->
    <rect x="164" y="148" width="42" height="106" rx="21" fill="url(#kWhite)" />
    <!-- Grilles acoustiques subtiles dans la capsule du micro -->
    <rect x="174" y="168" width="22" height="5" rx="2.5" fill="#6d28d9" opacity="0.45" />
    <rect x="174" y="182" width="22" height="5" rx="2.5" fill="#6d28d9" opacity="0.45" />
    <rect x="174" y="196" width="22" height="5" rx="2.5" fill="#6d28d9" opacity="0.45" />

    <!-- Berceau/Socle du micro + Pied formant le bas de la colonne du K -->
    <path d="M 154 226 C 154 252 170 270 185 270 C 200 270 216 252 216 226"
          fill="none" stroke="url(#amberGrad)" stroke-width="10" stroke-linecap="round" />
    <rect x="166" y="268" width="38" height="96" rx="19" fill="url(#kWhite)" />

    <!-- Branche supérieure du K (dynamique, nette et ouverte) -->
    <path d="M 206 252 L 302 162 C 312 153 328 154 336 164 C 345 174 343 190 333 199 L 246 280 Z"
          fill="url(#kWhite)" />

    <!-- Branche inférieure du K -->
    <path d="M 226 258 L 316 350 C 325 360 325 376 315 385 C 305 395 289 395 280 385 L 198 302 Z"
          fill="url(#kWhite)" />

    <!-- Onde Vocale Ambre Or à droite du K (symbolisant la voix retranscrite) -->
    <rect x="338" y="232" width="12" height="48" rx="6" fill="url(#amberGrad)" />
    <rect x="360" y="210" width="12" height="92" rx="6" fill="url(#amberGrad)" />
    <rect x="382" y="238" width="12" height="36" rx="6" fill="url(#amberGrad)" />
  </g>

  <!-- 4. Étincelle IA Gemini (Haut-Droite du Carnet) -->
  <g filter="url(#innerShadow)" transform="translate(338, 92)">
    <path d="M 0 34 C 19 34 34 19 34 0 C 34 19 49 34 68 34 C 49 34 34 49 34 68 C 34 49 19 34 0 34 Z"
          fill="url(#amberGrad)" />
    <circle cx="34" cy="34" r="5" fill="#ffffff" />
  </g>
</svg>
